name: Release

# Builds the production bundle, signs a SLSA build provenance attestation for
# it with GitHub's native attestation service, and attaches it to the release.
# Verify a downloaded bundle with:
#   gh attestation verify justeg-<version>.tar.gz --repo evansem/steganography

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      id-token: write # request the OIDC token that signs the attestation
      attestations: write # store the attestation on the repository
    outputs:
      bundle: ${{ steps.package.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Pack only what `npm ci --omit=dev && npm start` needs, with fixed
      # ordering, owners and timestamps so the digest depends on content alone.
      - name: Package bundle
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle="justeg-${REF_NAME//\//-}.tar.gz"
          files=(.next package.json package-lock.json next.config.ts)
          [[ -d public ]] && files+=(public)
          tar --sort=name --exclude=.next/cache \
            --mtime="@$(git log -1 --format=%ct)" \
            --owner=0 --group=0 --numeric-owner \
            -cf - "${files[@]}" | gzip -n -9 > "$bundle"
          sha256sum "$bundle" | tee "$bundle.sha256"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.bundle }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: |
            ${{ steps.package.outputs.bundle }}
            ${{ steps.package.outputs.bundle }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ needs.build.outputs.bundle }}
        run: gh release upload "$TAG" "$BUNDLE" "$BUNDLE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
